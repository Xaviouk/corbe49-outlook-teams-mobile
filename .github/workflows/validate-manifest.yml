name: Validate Office add-in manifest

on:
  push:
    branches: [main]
    paths:
      - "manifest.xml"
      - ".github/workflows/validate-manifest.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest
        run: npx --yes office-addin-manifest validate manifest.xml
